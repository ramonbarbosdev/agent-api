services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-api-postgres
    environment:
      POSTGRES_DB: agent_api
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - agent_api_pgdata:/var/lib/postgresql/data

volumes:
  agent_api_pgdata:
