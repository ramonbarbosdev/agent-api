spring.datasource.url=jdbc:h2:mem:agent_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS agent
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=agent
spring.flyway.enabled=false

agent.rag.enabled=false
agent.auth.enabled=false
agent.secrets.encryption-key=
agent.gateway.default-project-path=${java.io.tmpdir}
agent.gateway.sidecar-url=http://127.0.0.1:8791
agent.gateway.audit-path=${java.io.tmpdir}/agent-api-audit
agent.auth.jwt-secret=test-jwt-secret-key-minimum-32-characters-long
