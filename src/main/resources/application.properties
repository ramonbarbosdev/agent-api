server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

agent.deployment.tenant-mode=${AGENT_TENANT_MODE:single}

agent.engine.max-tool-steps=${AGENT_MAX_TOOL_STEPS:5}
agent.engine.max-context-chars=${AGENT_MAX_CONTEXT_CHARS:48000}

agent.conversation.history-limit=${CONVERSATION_HISTORY_LIMIT:50}

agent.rag.enabled=${AGENT_RAG_ENABLED:true}
agent.rag.top-k=${AGENT_RAG_TOP_K:4}
agent.rag.inject-into-system-prompt=${AGENT_RAG_INJECT:true}
agent.rag.chunk-max-chars=${AGENT_RAG_CHUNK_MAX_CHARS:900}
agent.rag.chunk-overlap-chars=${AGENT_RAG_CHUNK_OVERLAP:120}

llm.provider=ollama

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:8b}
ollama.timeout=${OLLAMA_TIMEOUT:60s}
