server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

agent.deployment.tenant-mode=${AGENT_TENANT_MODE:single}

agent.conversation.history-limit=${CONVERSATION_HISTORY_LIMIT:50}

agent.rag.enabled=${AGENT_RAG_ENABLED:true}
agent.rag.top-k=${AGENT_RAG_TOP_K:4}
agent.rag.chunk-max-chars=${AGENT_RAG_CHUNK_MAX_CHARS:900}
agent.rag.chunk-overlap-chars=${AGENT_RAG_CHUNK_OVERLAP:120}

agent.auth.enabled=${AGENT_AUTH_ENABLED:true}
agent.auth.jwt-secret=${AGENT_AUTH_JWT_SECRET:dev-only-change-me-use-32-char-secret-minimum}
agent.auth.jwt-expiration-minutes=${AGENT_AUTH_JWT_EXPIRATION_MINUTES:1440}

agent.secrets.encryption-key=${AGENT_API_SECRETS_KEY:}

agent.gateway.ia-path=${AGENT_API_IA_PATH:/home/ia}
agent.gateway.audit-path=${AGENT_API_AUDIT_PATH:}
agent.gateway.max-sessions=${AGENT_API_MAX_SESSIONS:10}
agent.gateway.session-timeout-minutes=${AGENT_API_SESSION_TIMEOUT:120}
agent.gateway.max-message-chars=${AGENT_API_MAX_MESSAGE_CHARS:32000}
agent.gateway.sidecar-url=${CURSOR_SIDECAR_URL:http://127.0.0.1:8791}
agent.gateway.sidecar-token=${CURSOR_SIDECAR_TOKEN:}
agent.gateway.sidecar-auto-start=${CURSOR_SIDECAR_AUTO_START:false}
agent.gateway.project-root-allowlist=${AGENT_API_PROJECT_ROOT_ALLOWLIST:}
agent.gateway.default-project-path=${AGENT_GATEWAY_DEFAULT_PROJECT_PATH:}
